[pytest]
testpaths = tests
# Make `import src...` work however pytest is launched (pytest >= 7).
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests for individual agents
    integration: Integration tests for orchestrator
    slow: Slow running tests
    mock: Tests using mocks
    llm: End-to-end tests against the real LLM (opt-in: RUN_LLM_TESTS=1)
